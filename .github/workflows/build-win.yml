name: Build & publish Windows

# Builda o instalador NSIS (.exe) num runner Windows e publica no feed do
# servidor (downloads/ + latest.yml + .blockmap) e registra a release 'win'.
# O electron-updater do app baixa/instala sozinho a partir do latest.yml.
# Dispara quando a versão muda (package.json) ou manualmente.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: build-win
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm install

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key" || true
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"

      - name: Publish to feed + register release
        env:
          V: ${{ steps.ver.outputs.v }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          SSH="ssh -p $PORT -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          EXE="dist-app/maestrus-win-${V}.exe"
          MAP="dist-app/maestrus-win-${V}.exe.blockmap"
          YML="dist-app/latest.yml"
          for f in "$EXE" "$MAP" "$YML"; do
            test -f "$f" || { echo "arquivo não encontrado: $f"; ls -la dist-app; exit 1; }
          done
          REMOTE="/opt/maestrus/data/downloads"
          URL="https://maestrus.cloud/downloads/maestrus-win-${V}.exe"
          rsync -rlz -e "$SSH" "$EXE" "$MAP" "$YML" "root@${HOST}:${REMOTE}/"
          $SSH "root@${HOST}" "chmod 644 '${REMOTE}/maestrus-win-${V}.exe' '${REMOTE}/maestrus-win-${V}.exe.blockmap' '${REMOTE}/latest.yml' && docker compose -f /opt/maestrus/docker-compose.yml exec -T app php /var/www/html/register-release.php '${V}' win '${URL}'"

      - name: Publish ASAR patch (smart update)
        env:
          V: ${{ steps.ver.outputs.v }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # Extrai o app.asar do bundle Windows gerado e publica para update
          # in-place (preserva permissões UAC/SmartScreen).
          node scripts/publish-asar.js
          SSH="ssh -p $PORT -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE="/opt/maestrus/data/downloads/asar"
          for plat_dir in dist-asar/*/; do
            plat=$(basename "$plat_dir")
            $SSH "root@${HOST}" "mkdir -p ${REMOTE}/${plat}/${V}"
            rsync -rlz -e "$SSH" "${plat_dir}${V}/app.asar" "root@${HOST}:${REMOTE}/${plat}/${V}/app.asar"
            rsync -rlz -e "$SSH" "${plat_dir}latest.json" "root@${HOST}:${REMOTE}/${plat}/latest.json"
            echo "[asar] published ${plat}/${V}"
          done
