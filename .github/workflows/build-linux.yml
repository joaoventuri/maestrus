name: Build Linux (AppImage)

# Builda o AppImage do desktop Linux num runner Ubuntu (electron-builder precisa
# de ambiente Linux). Publicado como artefato do workflow (e, quando o repo
# público maestrus-selfhost existir, anexado à Release). Dispara na mudança de
# versão (package.json) ou manualmente.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: build-linux
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Build Linux AppImage
        run: npm run build:linux

      - name: Read version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestrus-linux-${{ steps.ver.outputs.v }}
          path: dist-app/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Setup SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"

      # Publica no feed de downloads do maestrus.cloud e registra na tabela
      # releases — o link evergreen /download/linux passa a apontar pra cá.
      - name: Publish to feed + register release
        env:
          V: ${{ steps.ver.outputs.v }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          SSH="ssh -p $PORT -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          SRC=$(ls dist-app/*.AppImage | head -1)
          test -f "$SRC" || { echo "AppImage não encontrado"; ls -la dist-app; exit 1; }
          NAME="maestrus-linux-${V}.AppImage"
          REMOTE="/opt/maestrus/data/downloads"
          URL="https://maestrus.cloud/downloads/${NAME}"
          rsync -rlz -e "$SSH" "$SRC" "root@${HOST}:${REMOTE}/${NAME}"
          $SSH "root@${HOST}" "chmod 644 '${REMOTE}/${NAME}' && docker compose -f /opt/maestrus/docker-compose.yml exec -T app php /var/www/html/register-release.php '${V}' linux '${URL}'"

