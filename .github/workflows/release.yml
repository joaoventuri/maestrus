# Release completo: instaladores das 3 plataformas + imagens de container.
#
# Dispara quando a versão muda no package.json (ou na mão, pelo botão Run).
# Actions é gratuito e ilimitado em repositório público, então não há motivo
# para economizar job aqui.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só buildar, sem publicar'
        type: boolean
        default: false

permissions:
  contents: write      # criar a release e subir os binários
  packages: write      # publicar no GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false     # nunca abortar um release pela metade

jobs:
  # A versão vira saída única para todos os jobs. Sem isto, cada job leria o
  # package.json por conta e um push no meio do caminho produziria release com
  # binários de versões diferentes.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: v${{ steps.v.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - id: check
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Release v${{ steps.v.outputs.version }} já existe; os binários serão substituídos."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm test          # inclui o check de i18n e o no-paywall
      - run: npx tsc --noEmit -p renderer/tsconfig.json || true

  desktop:
    needs: [version, test]
    strategy:
      fail-fast: false         # macOS falhar não pode impedir Windows de sair
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifacts: 'dist-app/*.exe dist-app/latest.yml dist-app/*.blockmap'
          - os: macos-latest
            script: build:mac
            artifacts: 'dist-app/*.dmg dist-app/latest-mac.yml dist-app/*.blockmap'
          - os: ubuntu-latest
            script: build:linux
            artifacts: 'dist-app/*.AppImage dist-app/latest-linux.yml'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado de assinatura configurado, o electron-builder tenta
          # assinar e falha. Desligado explicitamente para o build ser
          # reproduzível por qualquer pessoa que forkar o projeto.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # O latest*.yml é o que o electron-updater lê para saber que há versão
      # nova. Subir o instalador sem ele = ninguém recebe update, em silêncio.
      - name: Publicar na Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          shopt -s nullglob
          files=(${{ matrix.artifacts }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Build não gerou artefato em dist-app/"; exit 1
          fi
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --notes "Instaladores para Windows, macOS e Linux. O app se atualiza sozinho a partir daqui." \
            2>/dev/null || true
          gh release upload "${{ needs.version.outputs.tag }}" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: dist-app/
          retention-days: 7

  # Imagens para quem roda o Maestrus num servidor. Multi-arch porque VPS ARM
  # (Ampere, Graviton, Oracle free tier) é comum e barato.
  containers:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexto e Dockerfile sao declarados separados de proposito: o
          # server COPIA electron/ e relay/, entao precisa da raiz do repo como
          # contexto. Passar ./maestrus-server quebrava com "/electron: not found".
          - image: maestrus-relay
            context: ./relay
            dockerfile: ./relay/Dockerfile
          - image: maestrus-server
            context: .
            dockerfile: ./maestrus-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # O Dockerfile do server copia dist-web/ e dist-mobile/, que sao
      # artefatos de build e nao existem no repo (gitignored). Sem gerar antes,
      # o buildx morre com "/dist-web: not found". O relay nao precisa disto,
      # entao roda so onde faz falta.
      - uses: actions/setup-node@v4
        if: matrix.image == 'maestrus-server'
        with: { node-version: '22', cache: 'npm' }
      - name: Gerar assets do web e do PWA
        if: matrix.image == 'maestrus-server'
        run: |
          npm ci
          npm run build:web
          npm run build:mobile

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Um resumo que diz o que REALMENTE saiu. Com fail-fast desligado, um job
  # pode falhar sozinho e passar despercebido no meio do verde.
  summary:
    needs: [version, desktop, containers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "## ${{ needs.version.outputs.tag }}"
            echo ""
            echo "| Alvo | Status |"
            echo "|---|---|"
            echo "| Instaladores (win/mac/linux) | ${{ needs.desktop.result }} |"
            echo "| Imagens GHCR (amd64/arm64) | ${{ needs.containers.result }} |"
            echo ""
            if [ "${{ needs.desktop.result }}" != "success" ] || [ "${{ needs.containers.result }}" != "success" ]; then
              echo "> Alguma plataforma falhou. A release pode estar incompleta."
            fi
          } >> $GITHUB_STEP_SUMMARY
